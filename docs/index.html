<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BTBX — Bare Tiny(?) BASIC eXecutor</title>
<style>
  body { background:#000; color:#0f0; font-family:monospace; margin:0; padding:16px; }
  #screen_container {
    white-space: pre;
    font-size: 14px;
    line-height: 14px;
    outline: none;
    display: inline-block;
    border: 1px solid #0a0;
    padding: 2px;
    min-width: 640px;
    min-height: 400px;
    box-sizing: border-box;
  }
  a { color:#0ff; }
  #status { color:#ff0; }
</style>
</head>
<body>
<p>BTBX — Bare Tiny(?) BASIC eXecutor. Requires JavaScript and XHR allowed for 3rd parties.<br>
This demo is beta. Reviewers please use make && make run as specified in README.md. <br>
Source: <a href="https://github.com/onyx-the-one/BTBX" target="_blank" rel="noopener">github.com/onyx-the-one/BTBX</a></p>

<p id="status">Loading…</p>

<div id="screen_container" tabindex="0">
  <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
  <canvas style="display: none"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/v86@0.5.44/build/libv86.js"></script>
<script>
"use strict";
window.onload = function () {
  var statusEl = document.getElementById("status");
  var screen = document.getElementById("screen_container");

  if (typeof V86 === "undefined") {
    statusEl.textContent = "Failed to load the v86 emulator script (libv86.js). Check JS/XHR blocking, adblockers, and try reloading.";
    return;
  }

  var emulator = new V86({
    wasm_path: "https://cdn.jsdelivr.net/npm/v86@0.5.44/build/v86.wasm",
    memory_size: 32 * 1024 * 1024,
    vga_memory_size: 2 * 1024 * 1024,
    screen_container: screen,
    bios: {
      url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin",
    },
    vga_bios: {
      url: "https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin",
    },
    hda: {
      url: "btbx.img",
    },
    autostart: true,
  });

  function refocus() {
    screen.focus();
    var canvas = screen.querySelector("canvas");
    var inner = screen.querySelector("div");
    if (canvas && typeof canvas.focus === "function") canvas.focus();
    else if (inner && typeof inner.focus === "function") inner.focus();
  }

  screen.addEventListener("mousedown", function () { setTimeout(refocus, 0); });
  screen.addEventListener("click", refocus);
  window.addEventListener("click", function (e) {
    if (screen.contains(e.target) || e.target === screen) refocus();
  });

  /* ── Raw PS/2 scancode (set 1) keyboard bridge ──────────────────────
     Instead of trying to interpret e.key (which depends on layout,
     dead keys, and browser IME composition), we map the physical key
     (e.code) directly to its PS/2 set-1 scancode and feed make/break
     codes straight into v86's emulated PS/2 controller. This mirrors
     exactly what real hardware sends, so Shift + key combinations are
     handled by the emulated BIOS/OS the same way they would be on a
     real machine, instead of relying on the browser to hand us an
     already-shifted character. */
  var CODE_TO_SCANCODE = {
    "Escape": 0x01, "Digit1": 0x02, "Digit2": 0x03, "Digit3": 0x04, "Digit4": 0x05,
    "Digit5": 0x06, "Digit6": 0x07, "Digit7": 0x08, "Digit8": 0x09, "Digit9": 0x0A,
    "Digit0": 0x0B, "Minus": 0x0C, "Equal": 0x0D, "Backspace": 0x0E, "Tab": 0x0F,
    "KeyQ": 0x10, "KeyW": 0x11, "KeyE": 0x12, "KeyR": 0x13, "KeyT": 0x14,
    "KeyY": 0x15, "KeyU": 0x16, "KeyI": 0x17, "KeyO": 0x18, "KeyP": 0x19,
    "BracketLeft": 0x1A, "BracketRight": 0x1B, "Enter": 0x1C, "ControlLeft": 0x1D,
    "KeyA": 0x1E, "KeyS": 0x1F, "KeyD": 0x20, "KeyF": 0x21, "KeyG": 0x22,
    "KeyH": 0x23, "KeyJ": 0x24, "KeyK": 0x25, "KeyL": 0x26, "Semicolon": 0x27,
    "Quote": 0x28, "Backquote": 0x29, "ShiftLeft": 0x2A, "Backslash": 0x2B,
    "KeyZ": 0x2C, "KeyX": 0x2D, "KeyC": 0x2E, "KeyV": 0x2F, "KeyB": 0x30,
    "KeyN": 0x31, "KeyM": 0x32, "Comma": 0x33, "Period": 0x34, "Slash": 0x35,
    "ShiftRight": 0x36, "NumpadMultiply": 0x37, "AltLeft": 0x38, "Space": 0x39,
    "CapsLock": 0x3A, "F1": 0x3B, "F2": 0x3C, "F3": 0x3D, "F4": 0x3E, "F5": 0x3F,
    "F6": 0x40, "F7": 0x41, "F8": 0x42, "F9": 0x43, "F10": 0x44, "NumLock": 0x45,
    "ScrollLock": 0x46, "Numpad7": 0x47, "Numpad8": 0x48, "Numpad9": 0x49,
    "NumpadSubtract": 0x4A, "Numpad4": 0x4B, "Numpad5": 0x4C, "Numpad6": 0x4D,
    "NumpadAdd": 0x4E, "Numpad1": 0x4F, "Numpad2": 0x50, "Numpad3": 0x51,
    "Numpad0": 0x52, "NumpadDecimal": 0x53, "F11": 0x57, "F12": 0x58
  };
  /* Extended (0xE0-prefixed) keys */
  var CODE_TO_SCANCODE_E0 = {
    "ControlRight": 0x1D, "AltRight": 0x38, "ArrowUp": 0x48, "ArrowLeft": 0x4B,
    "ArrowRight": 0x4D, "ArrowDown": 0x50, "Insert": 0x52, "Delete": 0x53,
    "Home": 0x47, "End": 0x4F, "PageUp": 0x49, "PageDown": 0x51,
    "NumpadEnter": 0x1C, "NumpadDivide": 0x35
  };

  function sendScancodeForEvent(e, isDown) {
    var code = e.code;
    var bytes = null;
    if (CODE_TO_SCANCODE.hasOwnProperty(code)) {
      var sc = CODE_TO_SCANCODE[code];
      bytes = isDown ? [sc] : [sc | 0x80];
    } else if (CODE_TO_SCANCODE_E0.hasOwnProperty(code)) {
      var sc2 = CODE_TO_SCANCODE_E0[code];
      bytes = isDown ? [0xE0, sc2] : [0xE0, sc2 | 0x80];
    }
    if (bytes && typeof emulator.keyboard_send_scancodes === "function") {
      emulator.keyboard_send_scancodes(bytes);
      return true;
    }
    return false;
  }

  function inScreen() {
    return document.activeElement === screen || screen.contains(document.activeElement);
  }

  document.addEventListener("keydown", function (e) {
    if (!inScreen()) return;
    if (sendScancodeForEvent(e, true)) e.preventDefault();
  }, true);

  document.addEventListener("keyup", function (e) {
    if (!inScreen()) return;
    if (sendScancodeForEvent(e, false)) e.preventDefault();
  }, true);

  document.addEventListener("compositionstart", function (e) {
    if (inScreen()) e.preventDefault();
  }, true);

  document.addEventListener("beforeinput", function (e) {
    if (inScreen() && e.inputType && e.inputType.indexOf("insertComposition") === 0) {
      e.preventDefault();
    }
  }, true);

  emulator.add_listener("emulator-ready", function () {
    statusEl.textContent = "Running. (Click the screen above to interact)";
    refocus();
  });

  emulator.add_listener("emulator-loaded", function () {
    statusEl.textContent = "Booting…";
  });
};
</script>
</body>
</html>
